name: FolloWeight CI & Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  web-test-and-build:
    name: Typecheck, Unit Tests & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android-apk-build:
    name: Build Android APK & Play Store AAB (Capacitor API 36)
    needs: web-test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm ci
      - name: Sync Capacitor Android with Vercel Production URL
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://followeight.com' }}
          NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY || secrets.NEXT_PUBLIC_REVENUECAT_API_KEY || vars.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY || '' }}
          NEXT_PUBLIC_REVENUECAT_API_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_API_KEY || secrets.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY || vars.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY || '' }}
        run: npx cap sync android
      - name: Configure Release Signing if Keystore Secret Present
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/followeight-upload.jks"
            echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/followeight-upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'followeight-upload' }}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Debug APK & Release AAB with Gradle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Upload FolloWeight Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolloWeight-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload FolloWeight Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolloWeight-Android-AAB-Bundle
          path: android/app/build/outputs/bundle/release/*.aab
