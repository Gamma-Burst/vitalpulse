name: FolloWeight CI & Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  web-test-and-build:
    name: Typecheck, Unit Tests & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android-apk-build:
    name: Build Android Debug APK (Capacitor)
    needs: web-test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm ci
      - name: Sync Capacitor Android with Vercel Production URL
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://followeight.com' }}
        run: npx cap sync android
      - name: Build Debug APK & Release AAB with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Upload FolloWeight Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolloWeight-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload FolloWeight Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolloWeight-Android-AAB-Bundle
          path: android/app/build/outputs/bundle/release/*.aab
